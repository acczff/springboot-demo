server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: ${APP_USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**, /api/roles/**, /api/permissions/**, /api/menus/**, /api/logs/**

        - id: biz-service
          uri: ${APP_BIZ_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/**, /cache-drill/**
