services:
  db:
    image: mysql:8.0
    mem_limit: 384m
    cpus: "0.70"
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: springboot_demo
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    cpus: "0.20"
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    mem_limit: 512m
    cpus: "0.60"
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none +hmqd off_heap"
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK_ABSOLUTE: 256MB
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      args:
        MODULE: springboot-demo-user
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    mem_limit: 384m
    cpus: "0.60"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Djava.security.egd=file:/dev/./urandom"
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/springboot_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

  biz-service:
    build:
      context: .
      args:
        MODULE: springboot-demo-biz
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 512m
    cpus: "0.70"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx288m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m -Djava.security.egd=file:/dev/./urandom"
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/springboot_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      APP_USER_SERVICE_URL: http://user-service:8081

  gateway:
    build:
      context: .
      args:
        MODULE: springboot-demo-gateway
    expose:
      - "8080"
    ports:
      - "8080:8080"
    mem_limit: 256m
    cpus: "0.40"
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      biz-service:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -Djava.security.egd=file:/dev/./urandom"
      SERVER_PORT: 8080
      APP_USER_SERVICE_URI: http://user-service:8081
      APP_BIZ_SERVICE_URI: http://biz-service:8082
    networks:
      default:
        aliases:
          - app

  web:
    build: ../springboot-web
    mem_limit: 128m
    cpus: "0.20"
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
