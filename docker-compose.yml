services:

  db:                          # MySQL 数据库服务
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: springboot_demo
    ports:
      - "3307:3306"            # 宿主机3307→容器3306（避免和服务器本地MySQL冲突）
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:                       # Redis 缓存服务
    image: redis:7-alpine
    ports:
      - "6380:6379"            # 宿主机6380→容器6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:                         # 后端 Spring Boot 服务
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped    # 异常退出时自动重启
    depends_on:
      db:
        condition: service_healthy    # 等 MySQL 健康检查通过后再启动 app
      redis:
        condition: service_healthy    # 等 Redis 健康检查通过后再启动 app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/springboot_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis   # 覆盖 application.yml 中的 localhost